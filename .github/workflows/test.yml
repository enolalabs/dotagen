name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - name: Verify release targets compile
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/dotagen
          done
