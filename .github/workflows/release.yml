name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GO_VERSION: "1.26.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            OUT="dist/dotagen_${VERSION}_${GOOS}_${GOARCH}"
            [ "$GOOS" = "windows" ] && OUT="${OUT}.exe"
            echo "building $OUT"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags="-s -w -X github.com/enolalabs/dotagen/v2/internal/cli.version=${TAG}" \
              -o "$OUT" ./cmd/dotagen
          done
          (cd dist && sha256sum * > "checksums_${VERSION}.txt")
          ls -la dist

      - name: Smoke test linux binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BIN="dist/dotagen_${TAG#v}_linux_amd64"
          chmod +x "$BIN"
          "$BIN" version | grep -F "dotagen $TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
